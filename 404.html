<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Page not found - Corban Construction Ltd"
    />
    <title>404 - Page Not Found | Corban Construction Ltd</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* CSS Variables - Matching Main Homepage */
      :root {
        /* Primary — rich ocean blue */
        --primary-color: #1a6eb5;
        --primary-dark: #0f4f8a;
        --primary-light: #2e8fd4;

        /* Secondary — deep navy */
        --secondary-color: #0d2137;
        --secondary-dark: #071420;

        /* Accent — turquoise / teal */
        --accent-color: #0ea5a0;
        --accent-light: #14c4be;

        /* Backgrounds & neutrals */
        --light-color: #f0f7ff;
        --light-gray: #ddeef9;
        --dark-color: #0d2137;

        /* Text */
        --text-color: #1a2e40;
        --text-light: #5a7a94;

        /* Absolute */
        --white: #ffffff;
        --black: #000000;

        /* Status */
        --error-color: #e74c3c;
        --success-color: #27ae60;
        --warning-color: #f0a500;

        /* Shadows — now tinted blue */
        --shadow-sm: 0 2px 5px rgba(10, 60, 110, 0.1);
        --shadow: 0 5px 15px rgba(10, 60, 110, 0.12);
        --shadow-lg: 0 10px 30px rgba(10, 60, 110, 0.18);
        --shadow-xl: 0 20px 50px rgba(10, 60, 110, 0.22);

        /* Everything else unchanged */
        --transition: all 0.3s ease;
        --transition-slow: all 0.5s ease;
        --border-radius: 8px;
        --border-radius-lg: 12px;
        --border-radius-xl: 20px;
        --max-width: 1200px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Open Sans", sans-serif;
        background: linear-gradient(
          135deg,
          var(--secondary-color) 0%,
          var(--secondary-dark) 100%
        );
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--white);
        text-align: center;
        padding: 2rem;
      }

      .error-container {
        max-width: 600px;
      }

      .error-code {
        font-family: "Montserrat", sans-serif;
        font-size: 8rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 1rem;
        background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--accent-color)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .error-title {
        font-family: "Montserrat", sans-serif;
        font-size: 2rem;
        margin-bottom: 1rem;
        font-weight: 600;
      }

      .error-message {
        font-size: 1.1rem;
        margin-bottom: 2rem;
        opacity: 0.9;
        line-height: 1.6;
      }

      .error-illustration {
        font-size: 5rem;
        margin-bottom: 2rem;
        color: var(--primary-color);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 1rem 2rem;
        background: var(--primary-color);
        color: var(--white);
        text-decoration: none;
        border-radius: 50px;
        font-weight: 600;
        transition: var(--transition);
        margin: 0.5rem;
      }

      .btn:hover {
        background: var(--primary-dark);
        transform: translateY(-3px);
        box-shadow: var(--shadow);
      }

      .btn-outline {
        background: transparent;
        border: 2px solid var(--white);
      }

      .btn-outline:hover {
        background: var(--white);
        color: var(--secondary-color);
        box-shadow: var(--shadow-sm);
      }

      .quick-links {
        margin-top: 3rem;
        padding-top: 2rem;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .quick-links h3 {
        font-family: "Montserrat", sans-serif;
        font-size: 1.1rem;
        margin-bottom: 1rem;
        opacity: 0.9;
      }

      .quick-links ul {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
      }

      .quick-links a {
        color: rgba(255, 255, 255, 0.7);
        text-decoration: none;
        transition: var(--transition);
      }

      .quick-links a:hover {
        color: var(--primary-color);
      }

      @media (max-width: 480px) {
        .error-code {
          font-size: 5rem;
        }
        .error-title {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <div class="error-illustration">
        <i class="fas fa-hard-hat"></i>
      </div>
      <h1 class="error-code">404</h1>
      <h2 class="error-title">Page Under Construction</h2>
      <p class="error-message">
        Sorry, the page you're looking for doesn't exist or has been moved.
        We're constantly building and improving our website, just like we do
        with our projects.
      </p>
      <div class="error-actions">
        <a href="index.html" class="btn">
          <i class="fas fa-home"></i> Back to Home
        </a>
        <a href="index.html#contact" class="btn btn-outline">
          <i class="fas fa-envelope"></i> Contact Us
        </a>
      </div>
      <div class="quick-links">
        <h3>Popular Pages</h3>
        <ul>
          <li><a href="index.html#projects">Our Projects</a></li>
          <li><a href="index.html#services">Services</a></li>
          <li><a href="index.html#about">About Us</a></li>
          <li><a href="index.html#careers">Careers</a></li>
        </ul>
      </div>
    </div>
  </body>
</html>
